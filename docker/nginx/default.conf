# Port 80: the imaging network. PXE clients fetch the boot environment and
# image files here and talk to the agent API. No admin endpoints.
server {
    listen 80;
    client_max_body_size 0;
    sendfile on;
    tcp_nopush on;

    location /boot/ {
        alias /srv/bootenv/;
    }
    location /files/images/ {
        alias /data/images/;
    }
    location /files/system/ {
        alias /data/system/;
    }
    location /api/agent/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # stream captures straight to disk
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/boot/ {
        proxy_pass http://api:8000;
    }
    location / {
        return 404;
    }
}

# Port 8080: the admin UI. Publish it only through Pangolin, which adds the
# Remote-Email/Remote-Name headers the API trusts. Never expose it directly.
server {
    listen 8080;
    client_max_body_size 0;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;   # multi-GB WIM and driver uploads
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        try_files $uri /index.html;
    }
}
