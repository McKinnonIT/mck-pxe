<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mck-pxe</title>
    <link rel="icon" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="top"></header>
    <main id="main"><p class="muted">Starting…</p></main>
    <footer>
      <button class="btn ghost needs-user" data-action="refresh">Re-scan hardware</button>
      <span class="spacer"></span>
      <button class="btn ghost" data-action="text-mode">Text mode</button>
      <button class="btn ghost" data-action="power" data-value="reboot">Reboot</button>
      <button class="btn ghost" data-action="power" data-value="poweroff">Power off</button>
    </footer>
    <div id="modal" hidden></div>
    <div id="toast" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
