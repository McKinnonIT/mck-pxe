services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mckpxe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mckpxe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mckpxe"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mckpxe:${POSTGRES_PASSWORD}@db/mckpxe
      DATA_DIR: /data
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    # Port 80 serves the imaging network. The admin UI (8080) has no host port:
    # Pangolin reaches it through the server's newt as http://mck-pxe:8080, so
    # sign-in passwords travel over HTTPS.
    ports:
      - "80:80"
    networks:
      default:
      pangolin:
        aliases: [mck-pxe]
    volumes:
      - ./data/images:/data/images:ro
      - ./data/isos:/data/isos:ro
      - ./data/system:/data/system:ro
      - ./data/bootenv:/srv/bootenv:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/boot/ipxe/00:00:00:00:00:00"]
      interval: 30s
      timeout: 5s

  boot:
    build: ./docker/boot
    restart: unless-stopped
    # proxyDHCP and TFTP need broadcast traffic on the real network
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file: .env
    volumes:
      - ./data/bootenv:/tftp/mckpxe:ro

networks:
  # The Docker network of the newt container that Pangolin talks to
  pangolin:
    external: true
    name: ${PANGOLIN_NETWORK:?set PANGOLIN_NETWORK in .env to the network of your newt container}

volumes:
  pgdata:
